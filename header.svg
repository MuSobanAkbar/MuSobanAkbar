<svg xmlns="http://www.w3.org/2000/svg" width="840" height="120" viewBox="0 0 840 120" role="img" aria-label="Soban Akbar">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#A371F7" />
    </linearGradient>
  </defs>

  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #1F2328;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s forwards;
    }

    .line {
      stroke: url(#accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      animation: draw 0.8s ease-out 0.8s forwards;
    }

    @media (prefers-color-scheme: dark) {
      .name { fill: #E6EDF3; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <text class="name" x="420" y="66" text-anchor="middle">Soban Akbar</text>
  <line class="line" x1="310" y1="96" x2="530" y2="96" />
</svg>
