name: Update contribution heatmap

on:
  schedule:
    - cron: "17 6 * * *" # once a day
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # needed to commit heatmap.svg back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate heatmap.svg
        run: python scripts/heatmap.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit it if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add heatmap.svg
          git diff --cached --quiet || git commit -m "Update contribution heatmap"
          git push